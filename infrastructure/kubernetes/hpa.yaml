apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kapea-api
  namespace: kapea
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kapea-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kapea-rust-scan-worker
  namespace: kapea
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kapea-rust-scan-worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  # BullMQ waiting-job depth is not a native K8s metric. Consider
  # Prometheus Adapter or KEDA with a Redis/BullMQ queue-depth scaler for
  # queue-depth-driven scaling in production.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 600
