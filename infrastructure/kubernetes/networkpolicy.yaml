# Restrict worker ingress; allow workers to reach ClamAV, Redis, and object storage.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kapea-workers-egress
  namespace: kapea
spec:
  podSelector:
    matchLabels:
      app: kapea-rust-scan-worker
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: clamav
      ports:
        - protocol: TCP
          port: 3310
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: minio
      ports:
        - protocol: TCP
          port: 9000
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kapea-api-ingress
  namespace: kapea
spec:
  podSelector:
    matchLabels:
      app: kapea-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 3000

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kapea-deny-worker-ingress
  namespace: kapea
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - kapea-rust-scan-worker
          - kapea-result-consumer
          - kapea-retention-worker
  policyTypes:
    - Ingress
  ingress: []
