# Copy to secret.yaml and fill in values before applying.
# kubectl create secret generic kapea-secrets --from-env-file=secret.env -n kapea
apiVersion: v1
kind: Secret
metadata:
  name: kapea-secrets
  namespace: kapea
type: Opaque
stringData:
  DATABASE_URL: postgresql://kapea:CHANGE_ME@postgres.kapea.svc.cluster.local:5432/kapea
  S3_ACCESS_KEY: CHANGE_ME
  S3_SECRET_KEY: CHANGE_ME
  API_KEY: CHANGE_ME
  ADMIN_API_KEY: CHANGE_ME
  JWT_SECRET: CHANGE_ME
  SENTRY_DSN: ""
